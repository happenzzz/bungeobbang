<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>18개의 붕어빵을 한 봉지에 3개씩 묶어 봅시다</title>
  <style>
    :root {
      --ink: #162033;
      --navy: #17243f;
      --yellow: #ffd54c;
      --orange: #ef6a2e;
      --red: #d8341f;
      --teal: #12b9c7;
      --teal-dark: #067d89;
      --green: #24aa68;
      --card: rgba(255,255,255,.94);
      --line: rgba(23,36,63,.16);
      --shadow: 0 16px 34px rgba(23,36,63,.18);
      --fish-size: clamp(58px, 5.3vw, 92px);
      --tap: clamp(42px, 3.3vw, 58px);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overscroll-behavior: none;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      overflow: hidden;
      background: #d2d2d8;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button { font: inherit; border: 0; cursor: pointer; user-select: none; touch-action: manipulation; }
    button:focus-visible { outline: 0; box-shadow: 0 0 0 6px rgba(18,185,199,.22); }

    .activity {
      width: min(1920px, 100%);
      height: 100dvh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: clamp(86px, 13vh, 142px) minmax(0, 1fr) clamp(158px, 22vh, 230px);
      position: relative;
      overflow: hidden;
      background: #d5d5da;
      isolation: isolate;
    }

    .activity:fullscreen,
    .activity:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      background: #d5d5da;
    }

    .top-control {
      position: absolute;
      z-index: 200;
      left: clamp(12px, 1.2vw, 22px);
      right: clamp(12px, 1.2vw, 22px);
      top: clamp(8px, .9vw, 18px);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: clamp(8px, 1vw, 16px);
      pointer-events: none;
    }

    .top-left,
    .top-actions {
      display: flex;
      align-items: center;
      gap: clamp(7px, .8vw, 12px);
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .top-left { min-width: 0; flex: 1 1 auto; }
    .top-actions { justify-content: flex-end; flex: 0 0 auto; }

    .activity-title,
    .count-pill,
    .mini-btn,
    .fullscreen-toggle {
      min-height: var(--tap);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 8px clamp(12px, 1.05vw, 18px);
      font-weight: 1000;
      letter-spacing: -.04em;
      box-shadow: inset 0 -4px 0 rgba(23,36,63,.08), 0 7px 14px rgba(23,36,63,.09);
    }

    .activity-title {
      max-width: min(980px, 68vw);
      color: var(--navy);
      background: rgba(255,255,255,.96);
      border: 3px solid rgba(239,106,46,.26);
      font-size: clamp(18px, 1.7vw, 32px);
      line-height: 1.12;
      text-align: center;
      word-break: keep-all;
      box-shadow: 0 8px 16px rgba(0,0,0,.16), inset 0 -5px 0 rgba(23,36,63,.06);
    }

    .count-pill {
      color: #fff;
      background: #0f7f87;
      font-size: clamp(15px, 1.05vw, 20px);
      min-width: clamp(82px, 6.5vw, 116px);
      white-space: nowrap;
    }

    .mini-btn,
    .fullscreen-toggle {
      color: #17243f;
      background: rgba(255,255,255,.95);
      border: 2px solid rgba(23,36,63,.13);
      font-size: clamp(14px, .96vw, 19px);
      transition: transform .12s ease, filter .12s ease;
      white-space: nowrap;
    }

    .fullscreen-toggle {
      color: var(--teal-dark);
      background: #eaffff;
      border-color: rgba(18,185,199,.28);
    }

    .mini-btn:active,
    .fullscreen-toggle:active,
    .primary-btn:active,
    .secondary-btn:active { transform: translateY(2px); }

    .awning {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: minmax(0, 1fr) clamp(24px, 3.6vh, 42px);
      padding: 0 clamp(28px, 5vw, 80px);
      background:
        linear-gradient(180deg, rgba(255,255,255,.68), rgba(255,255,255,0) 38%),
        #e4e5e8;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,.20));
    }

    .awning-roof {
      margin-top: clamp(2px, .6vh, 10px);
      border-radius: 8px 8px 0 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 26%, rgba(0,0,0,.08) 100%),
        repeating-linear-gradient(90deg,
          var(--red) 0 8.333%,
          var(--yellow) 8.333% 16.666%);
      border: 4px solid rgba(90,43,17,.36);
      border-bottom: 0;
      transform: perspective(800px) rotateX(10deg);
      transform-origin: bottom;
      box-shadow: inset 0 -12px 0 rgba(0,0,0,.07);
    }

    .awning-flaps {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      height: 100%;
      border-left: 4px solid rgba(90,43,17,.34);
      border-right: 4px solid rgba(90,43,17,.34);
      overflow: hidden;
      border-radius: 0 0 18px 18px;
    }

    .awning-flaps span {
      position: relative;
      display: block;
      background: var(--red);
      box-shadow: inset 0 7px 0 rgba(255,255,255,.12), inset 0 -5px 0 rgba(0,0,0,.10);
    }

    .awning-flaps span:nth-child(even) { background: var(--yellow); }

    .awning-flaps span::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -42%;
      height: 88%;
      border-radius: 0 0 999px 999px;
      background: inherit;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.08);
    }

    .middle-area {
      position: relative;
      z-index: 0;
      min-height: 0;
      padding: clamp(10px, 1.2vw, 22px);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: clamp(10px, 1.1vw, 18px);
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.34) 0 18%, transparent 19%),
        radial-gradient(circle at 82% 84%, rgba(165,166,174,.45) 0 14%, transparent 15%),
        linear-gradient(180deg, #cacbd1 0%, #d9d9de 48%, #cfd0d5 100%);
      box-shadow: inset 0 8px 20px rgba(0,0,0,.08), inset 0 -9px 16px rgba(0,0,0,.09);
    }

    .middle-area::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .18;
      background-image:
        linear-gradient(rgba(255,255,255,.55) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.55) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }

    .play-card,
    .success-card {
      background: var(--card);
      border: 3px solid var(--line);
      border-radius: clamp(20px, 1.5vw, 30px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .play-card {
      position: relative;
      z-index: 2;
      min-height: 0;
      padding: clamp(10px, .95vw, 18px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(8px, .8vw, 13px);
      overflow: hidden;
    }

    .play-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }

    .feedback {
      min-height: clamp(46px, 5.4vh, 66px);
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      padding: clamp(9px, .8vw, 13px) clamp(11px, 1vw, 16px);
      border-radius: clamp(16px, 1.1vw, 22px);
      background: #f2f6ff;
      border: 2px solid rgba(75,126,230,.20);
      color: #39465f;
      font-size: clamp(14px, .98vw, 18px);
      line-height: 1.34;
      font-weight: 900;
      word-break: keep-all;
    }

    .feedback.warn { background: #fff4e7; border-color: rgba(239,106,46,.30); color: #8b3d00; }
    .feedback.good { background: #effdf5; border-color: rgba(36,170,104,.30); color: #076d3f; }

    .progress-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: clamp(40px, 3vw, 52px);
      padding: 7px 15px;
      border-radius: 999px;
      background: #e9ffef;
      border: 2px solid rgba(36,170,104,.24);
      color: #076d3f;
      font-size: clamp(15px, 1.05vw, 20px);
      font-weight: 1000;
      white-space: nowrap;
      box-shadow: inset 0 -4px 0 rgba(23,36,63,.06);
    }

    .drawing-board {
      position: relative;
      min-height: 0;
      border-radius: clamp(18px, 1.25vw, 27px);
      border: 4px solid rgba(23,36,63,.16);
      background:
        radial-gradient(circle at 9% 12%, rgba(255,255,255,.60) 0 11%, transparent 12%),
        radial-gradient(circle at 82% 26%, rgba(255,213,76,.16) 0 16%, transparent 17%),
        radial-gradient(circle at 92% 84%, rgba(239,106,46,.10) 0 18%, transparent 19%),
        linear-gradient(180deg, #e5e6eb 0%, #d4d5db 100%);
      overflow: hidden;
      touch-action: none;
      box-shadow: inset 0 -12px 20px rgba(23,36,63,.07), 0 9px 15px rgba(0,0,0,.08);
      cursor: crosshair;
    }

    .drawing-board::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .22;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(23,36,63,.20) 0 1px, transparent 1.5px);
      background-size: 17px 17px;
    }

    .drawing-board.complete {
      box-shadow: 0 0 0 8px rgba(36,170,104,.14), inset 0 -12px 20px rgba(23,36,63,.07), 0 9px 15px rgba(0,0,0,.08);
      border-color: rgba(36,170,104,.56);
    }

    #groupsSvg,
    #drawCanvas,
    .items-layer,
    .labels-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #groupsSvg { z-index: 20; pointer-events: none; }
    .group-shape { pointer-events: visiblePainted; cursor: grab; }
    .group-shape.is-being-dragged { opacity: .35; }
    .items-layer { z-index: 30; pointer-events: none; }
    .labels-layer { z-index: 40; pointer-events: none; }
    #drawCanvas { z-index: 60; pointer-events: none; }

    .fish-item {
      position: absolute;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
      width: var(--fish-size);
      height: calc(var(--fish-size) * .74);
      transform: translate(-50%, -50%) rotate(var(--rot));
      transform-origin: center;
      transition: filter .15s ease, opacity .15s ease, transform .15s ease;
      filter: drop-shadow(0 7px 3px rgba(70,45,24,.22));
    }

    .fish-item.grouped {
      filter: drop-shadow(0 5px 2px rgba(70,45,24,.16)) saturate(.98);
      opacity: .96;
    }

    .fish-item svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .fish-outline { stroke: #9a5a25; stroke-width: 4.8; stroke-linejoin: round; }
    .fish-scale { fill: none; stroke: rgba(112,58,20,.50); stroke-width: 2.8; stroke-linecap: round; }
    .fish-detail { fill: #7c4219; opacity: .65; }
    .fish-eye { fill: #5a2f14; }
    .fish-highlight { fill: rgba(255,245,206,.58); }

    .bag-label {
      position: absolute;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
      transform: translate(-50%, -50%);
      min-width: clamp(64px, 5.9vw, 104px);
      padding: 8px 14px 8px 13px;
      border-radius: 999px;
      color: var(--navy);
      background: rgba(255,255,255,.98);
      border: 3px solid var(--color);
      font-size: clamp(15px, 1.1vw, 21px);
      line-height: 1;
      font-weight: 1000;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 7px 14px rgba(23,36,63,.16), inset 0 -4px 0 rgba(23,36,63,.06);
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      transition: opacity .15s ease, filter .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .bag-label::after {
      content: "↘";
      display: inline-grid;
      place-items: center;
      width: 1.35em;
      height: 1.35em;
      margin-left: .34em;
      border-radius: 50%;
      background: rgba(255,213,76,.38);
      color: var(--navy);
      font-size: .72em;
      vertical-align: middle;
    }

    .bag-label.selected {
      filter: drop-shadow(0 0 10px rgba(255,213,76,.85));
      box-shadow: 0 0 0 7px rgba(255,213,76,.25), 0 7px 14px rgba(23,36,63,.16), inset 0 -4px 0 rgba(23,36,63,.06);
    }

    .bag-label.is-being-dragged { opacity: .24; }

    .fish-item.packed {
      opacity: 0;
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(.35);
      filter: none;
    }

    .group-ghost {
      position: fixed;
      z-index: 2200;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: clamp(120px, 12vw, 190px);
      padding: 14px 18px;
      border-radius: 999px;
      border: 4px solid var(--color);
      background: rgba(255,255,255,.98);
      color: var(--navy);
      font-size: clamp(20px, 1.8vw, 34px);
      line-height: 1;
      font-weight: 1000;
      box-shadow: 0 18px 28px rgba(0,0,0,.22), inset 0 -5px 0 rgba(23,36,63,.08);
      transform: translate(-50%, -50%) rotate(-4deg);
      transform-origin: center;
    }

    .group-ghost .ghost-fish { font-size: .72em; letter-spacing: -.22em; transform: translateY(1px); }

    .fly-fish {
      position: fixed;
      z-index: 2300;
      pointer-events: none;
      margin: 0;
      transform: none;
      transform-origin: center;
      filter: drop-shadow(0 16px 18px rgba(0,0,0,.22));
    }

    .activity:fullscreen .group-ghost,
    .activity:fullscreen .fly-fish,
    .activity:-webkit-full-screen .group-ghost,
    .activity:-webkit-full-screen .fly-fish { z-index: 2147483647; }

    .shop-sign {
      z-index: 1;
      position: relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,.78), rgba(241,244,248,.92)),
        #eef1f5;
      border-top: 5px solid rgba(23,36,63,.12);
      display: grid;
      grid-template-columns: clamp(176px, 17.5vw, 280px) minmax(0, 1fr);
      align-items: end;
      justify-items: stretch;
      gap: clamp(10px, 2vw, 34px);
      padding: clamp(8px, 1vh, 14px) clamp(16px, 3.4vw, 58px) clamp(4px, .6vh, 10px);
      box-shadow: inset 0 9px 20px rgba(23,36,63,.08);
      overflow: hidden;
      transition: box-shadow .16s ease, background .16s ease;
    }

    .shop-sign.drop-ready {
      box-shadow: inset 0 9px 20px rgba(23,36,63,.08), 0 0 0 8px rgba(18,185,199,.22);
      background:
        linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,246,205,.95)),
        #fff3c8;
    }

    .shop-sign.receiving {
      animation: shopPulse .48s ease both;
    }

    @keyframes shopPulse {
      from { box-shadow: inset 0 9px 20px rgba(23,36,63,.08), 0 0 0 0 rgba(255,213,76,.0); }
      to { box-shadow: inset 0 9px 20px rgba(23,36,63,.08), 0 0 0 12px rgba(255,213,76,.28); }
    }

    .golden-target {
      position: relative;
      z-index: 5;
      width: 100%;
      height: calc(100% - 6px);
      min-height: 92px;
      align-self: end;
      display: grid;
      align-items: end;
      padding-top: 18px;
      border-radius: 20px 20px 0 0;
      transition: transform .15s ease, box-shadow .15s ease;
      transform-origin: bottom center;
    }

    .golden-target.drop-ready,
    .shop-sign.drop-ready .golden-target {
      transform: translateY(-3px) scale(1.03);
      filter: drop-shadow(0 0 12px rgba(18,185,199,.34));
    }

    .golden-target.open { animation: targetOpen .48s ease both; }

    @keyframes targetOpen {
      0%, 100% { transform: translateY(-2px) scale(1.02); }
      50% { transform: translateY(-9px) scale(1.08) rotate(-1deg); }
    }

    .drop-hint {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 6;
      transform: translateX(-50%);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      border: 2px solid rgba(239,106,46,.22);
      color: #8a3d02;
      font-size: clamp(11px, .82vw, 15px);
      line-height: 1;
      font-weight: 1000;
      box-shadow: 0 5px 10px rgba(23,36,63,.10);
      white-space: nowrap;
      pointer-events: none;
    }

    .sign-board {
      height: calc(100% - 6px);
      width: 100%;
      max-width: 100%;
      min-height: 78px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      align-items: center;
      justify-items: center;
      gap: 0;
      padding: 8px 10px;
      border-radius: 18px 18px 0 0;
      border: 6px solid #fff;
      border-bottom: 0;
      background:
        conic-gradient(from 0deg at 50% 50%, #ffcf4b 0 18deg, var(--red) 18deg 36deg, #ffcf4b 36deg 54deg, var(--red) 54deg 72deg, #ffcf4b 72deg 90deg, var(--red) 90deg 108deg, #ffcf4b 108deg 126deg, var(--red) 126deg 144deg, #ffcf4b 144deg 162deg, var(--red) 162deg 180deg, #ffcf4b 180deg 198deg, var(--red) 198deg 216deg, #ffcf4b 216deg 234deg, var(--red) 234deg 252deg, #ffcf4b 252deg 270deg, var(--red) 270deg 288deg, #ffcf4b 288deg 306deg, var(--red) 306deg 324deg, #ffcf4b 324deg 342deg, var(--red) 342deg 360deg);
      box-shadow: 0 -4px 14px rgba(23,36,63,.15);
      overflow: hidden;
    }

    .sign-text {
      color: #fff6d9;
      text-shadow: -3px 0 0 rgba(160,37,18,.85), 3px 0 0 rgba(160,37,18,.85), 0 3px 0 rgba(160,37,18,.85), 0 -3px 0 rgba(160,37,18,.85), 0 5px 8px rgba(0,0,0,.25);
      font-size: clamp(20px, 2vw, 34px);
      line-height: .95;
      font-weight: 1000;
      letter-spacing: -.08em;
      white-space: nowrap;
      text-align: center;
    }

    .sign-fish {
      width: clamp(44px, 5.2vw, 78px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff7e5;
      border: 5px solid rgba(255,255,255,.82);
      box-shadow: 0 6px 12px rgba(0,0,0,.16);
    }

    .sign-fish svg { width: 82%; height: 82%; transform: rotate(-4deg); }

    .packed-bags-panel {
      position: relative;
      z-index: 4;
      width: 100%;
      height: calc(100% - 6px);
      min-height: 94px;
      align-self: end;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(4px, .55vh, 8px);
      padding: clamp(7px, .8vh, 12px) clamp(8px, 1vw, 14px) clamp(6px, .75vh, 10px);
      border-radius: 20px 20px 0 0;
      border: 3px solid rgba(23,36,63,.12);
      border-bottom: 0;
      background: rgba(255,255,255,.58);
      box-shadow: inset 0 5px 12px rgba(255,255,255,.55), 0 -4px 14px rgba(23,36,63,.07);
      overflow: hidden;
    }

    .bag-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 22px;
    }

    .bag-panel-title {
      color: #17243f;
      font-size: clamp(13px, .98vw, 18px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .bag-items {
      position: relative;
      z-index: 1;
      min-height: 0;
      display: flex;
      flex-wrap: nowrap;
      align-items: end;
      justify-content: flex-start;
      gap: clamp(6px, .8vw, 12px);
      padding: clamp(10px, 1.1vh, 18px) 2px 1px;
      overflow: hidden;
    }

    .bag-empty {
      width: 100%;
      min-height: clamp(58px, 8vh, 96px);
      display: grid;
      place-items: center;
      border-radius: 16px;
      border: 2px dashed rgba(23,36,63,.18);
      color: rgba(23,36,63,.54);
      background: rgba(255,255,255,.55);
      font-size: clamp(13px, .98vw, 17px);
      line-height: 1.25;
      font-weight: 1000;
      text-align: center;
      word-break: keep-all;
    }

    .finished-bag {
      --bag-w: clamp(72px, 8.7vw, 126px);
      position: relative;
      flex: 0 0 var(--bag-w);
      width: var(--bag-w);
      height: clamp(92px, 14.8vh, 150px);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      align-items: center;
      justify-items: center;
      padding: clamp(30px, 3.8vh, 48px) 7px 8px;
      border-radius: 12px 12px 6px 6px;
      border: 3px solid #6d5638;
      border-bottom-width: 5px;
      background:
        linear-gradient(150deg, rgba(255,255,255,.42), rgba(255,255,255,0) 36%),
        linear-gradient(180deg, #d6c28f, #bd9f62);
      box-shadow: 0 -3px 12px rgba(23,36,63,.14), inset 0 -8px 0 rgba(89,62,31,.12);
      animation: bagPop .28s ease both;
    }

    .finished-bag::before {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: -10px;
      height: 18px;
      border-radius: 50% 50% 42% 42%;
      background: #e5d1a0;
      border: 3px solid #6d5638;
      border-bottom: 0;
      box-shadow: inset 0 -5px 0 rgba(89,62,31,.08);
    }

    @keyframes bagPop {
      from { transform: translateY(18px) scale(.78); opacity: 0; }
      70% { transform: translateY(-4px) scale(1.04); opacity: 1; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .finished-bag .bag-fish-row {
      position: absolute;
      top: clamp(-14px, -1.8vh, -8px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 0;
      pointer-events: none;
    }

    .finished-bag .bag-mini-fish {
      width: clamp(24px, 2.9vw, 42px);
      height: clamp(18px, 2.1vw, 32px);
      flex: 0 0 auto;
      margin: 0 -4px;
      border-radius: 60% 48% 52% 60%;
      background: linear-gradient(135deg, #ffe1a0, #dc9342 63%, #aa5d23);
      border: 2px solid rgba(118,69,25,.72);
      position: relative;
      transform: rotate(var(--rot, -5deg));
      box-shadow: 0 2px 3px rgba(23,36,63,.14);
    }

    .finished-bag .bag-mini-fish::after {
      content: "";
      position: absolute;
      right: -7px;
      top: 50%;
      width: 10px;
      height: 10px;
      background: #c87833;
      border: 2px solid rgba(118,69,25,.72);
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
      transform: translateY(-50%);
    }

    .finished-bag-text {
      z-index: 2;
      width: 100%;
      display: grid;
      place-items: center;
      gap: 1px;
      color: #111;
      font-weight: 1000;
      letter-spacing: -.06em;
      text-align: center;
      line-height: 1.02;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .finished-bag-text span {
      display: block;
      font-size: clamp(17px, 1.65vw, 30px);
    }

    .finished-bag-text strong {
      display: block;
      font-size: clamp(18px, 1.9vw, 34px);
    }

    .finished-bag-index {
      z-index: 2;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(23,36,63,.88);
      color: #fff;
      font-size: clamp(10px, .75vw, 13px);
      line-height: 1;
      font-weight: 1000;
      white-space: nowrap;
    }

    .packed-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #17243f;
      color: #fff;
      font-size: clamp(11px, .86vw, 15px);
      line-height: 1;
      font-weight: 1000;
      white-space: nowrap;
    }

    .primary-btn,
    .secondary-btn {
      min-height: var(--tap);
      border-radius: 999px;
      padding: 9px clamp(12px, 1vw, 18px);
      font-size: clamp(15px, 1.05vw, 21px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -.04em;
      transition: transform .12s ease, filter .12s ease;
      white-space: nowrap;
    }

    .primary-btn {
      color: #fff;
      background: linear-gradient(135deg, var(--teal), #19d7ce);
      box-shadow: 0 7px 0 rgba(6,125,137,.34), 0 12px 19px rgba(18,185,199,.20);
    }

    .secondary-btn {
      color: var(--navy);
      background: #eef7ff;
      box-shadow: inset 0 -4px 0 rgba(23,36,63,.08);
    }

    .modal {
      position: fixed;
      z-index: 1200;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(18,22,35,.58);
      backdrop-filter: blur(8px);
    }

    .modal.open { display: flex; }

    .success-card {
      width: min(620px, 100%);
      padding: clamp(24px, 4vw, 42px);
      text-align: center;
      border: 5px solid #17243f;
      background: linear-gradient(180deg, #fffff6, #effff5);
      box-shadow: 0 20px 0 rgba(0,0,0,.25), 0 28px 58px rgba(0,0,0,.22);
      animation: pop .22s ease both;
    }

    @keyframes pop {
      from { transform: translateY(16px) scale(.92); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .success-card h2 {
      margin: 0 0 12px;
      color: #0c713e;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1.05;
      font-weight: 1000;
      letter-spacing: -.07em;
      text-shadow: 0 5px 0 rgba(182,255,151,.78);
    }

    .success-card p {
      margin: 0 0 20px;
      color: #30405a;
      font-size: clamp(19px, 2.1vw, 28px);
      line-height: 1.45;
      font-weight: 900;
      word-break: keep-all;
    }

    .success-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 1180px) and (orientation: landscape) {
      :root { --fish-size: clamp(52px, 5vw, 76px); --tap: 44px; }
      .activity { grid-template-rows: 96px minmax(0, 1fr) 164px; }
      .middle-area { padding: 10px; }
      .play-card { padding: 10px; gap: 8px; }
      .activity-title { max-width: min(780px, 66vw); font-size: 18px; }
      .feedback { font-size: 14px; padding: 9px 10px; }
      .shop-sign { grid-template-columns: 176px minmax(0, 1fr); gap: 12px; padding-left: 20px; padding-right: 20px; }
      .drop-hint { display: none; }
      .sign-text { font-size: 22px; }
      .sign-fish { width: 52px; }
      .packed-bags-panel { min-height: 96px; }
      .finished-bag { --bag-w: 82px; height: 116px; }
      .finished-bag-text span { font-size: 18px; }
      .finished-bag-text strong { font-size: 20px; }
      .top-actions { gap: 7px; }
      .mini-btn { font-size: 13px; padding-left: 10px; padding-right: 10px; }
    }

    @media (max-width: 940px), (orientation: portrait) {
      body { overflow: auto; }
      .activity { height: auto; min-height: 100svh; grid-template-rows: 110px auto auto; }
      .top-control { position: sticky; top: 8px; padding: 0 10px; left: 0; right: 0; }
      .middle-area { min-height: 720px; }
      .drawing-board { min-height: 560px; }
      .play-head { grid-template-columns: 1fr; }
      .play-status { justify-self: end; }
      .activity-title { max-width: min(820px, 86vw); }
      .shop-sign { grid-template-columns: 1fr; grid-template-rows: 122px 160px; gap: 10px; padding-left: 14px; padding-right: 14px; }
      .drop-hint { display: none; }
      .sign-board { width: min(240px, 100%); justify-self: start; }
      .packed-bags-panel { min-height: 150px; }
      .bag-items { flex-wrap: wrap; align-content: flex-end; overflow: visible; }
      .finished-bag { --bag-w: 82px; height: 116px; }
    }
  </style>
</head>
<body>
  <main id="activity" class="activity" aria-label="18개의 붕어빵을 한 봉지에 3개씩 묶어 봅시다.">
    <div class="top-control">
      <div class="top-left">
        <div class="activity-title">18개의 붕어빵을 한 봉지에 3개씩 묶어 봅시다.</div>
      </div>
      <div class="top-actions">
        <span id="remainPill" class="count-pill">18개 남음</span>
        <button id="undoBtn" class="mini-btn" type="button">마지막 취소</button>
        <button id="resetBtn" class="mini-btn" type="button">처음으로</button>
        <button id="fullscreenBtn" class="fullscreen-toggle" type="button">전체화면</button>
      </div>
    </div>

    <section class="awning" aria-hidden="true">
      <div class="awning-roof"></div>
      <div class="awning-flaps">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </section>

    <section class="middle-area">
      <section class="play-card" aria-label="붕어빵 묶기 활동판">
        <div class="play-head">
          <div id="feedback" class="feedback">
            <span aria-hidden="true">👆</span>
            <span>붕어빵 3개를 둘러 선을 그은 뒤, 만들어진 봉지를 아래 왼쪽 황금 붕어빵 쪽으로 옮겨 보세요.</span>
          </div>
          <div class="play-status">
            <div id="bagBadge" class="progress-badge">0/6봉지</div>
          </div>
        </div>

        <div id="drawingBoard" class="drawing-board" aria-label="선으로 붕어빵을 묶는 곳">
          <svg id="groupsSvg" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div id="itemsLayer" class="items-layer" aria-hidden="true"></div>
          <div id="labelsLayer" class="labels-layer" aria-hidden="true"></div>
          <canvas id="drawCanvas"></canvas>
        </div>
      </section>
    </section>

    <footer id="goldenDrop" class="shop-sign" data-drop-target="golden" aria-label="황금 붕어빵 쪽으로 묶은 봉지를 옮기는 곳">
      <div id="packingBag" class="golden-target" aria-live="polite">
        <div class="drop-hint">만든 봉지를 이곳에 내려놓아요</div>
        <div class="sign-board" aria-hidden="true">
          <div class="sign-text">황금</div>
          <div class="sign-fish">
            <svg viewBox="0 0 120 90" role="img" aria-label="붕어빵 그림">
              <defs>
                <linearGradient id="signFishGrad" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0" stop-color="#ffd987" />
                  <stop offset=".52" stop-color="#d9954a" />
                  <stop offset="1" stop-color="#b86d30" />
                </linearGradient>
              </defs>
              <path d="M17 48 C22 24 49 12 78 25 C88 19 101 14 111 17 C105 28 105 40 112 51 C100 54 89 51 79 45 C54 62 28 66 17 48 Z" fill="url(#signFishGrad)" stroke="#82471e" stroke-width="5" stroke-linejoin="round" />
              <path d="M37 34 C43 37 46 42 45 49 M51 30 C59 35 62 42 61 51 M66 30 C72 37 74 44 72 53" fill="none" stroke="#82471e" stroke-width="3" stroke-linecap="round" opacity=".55" />
              <circle cx="30" cy="42" r="4" fill="#5f3216" />
            </svg>
          </div>
          <div class="sign-text">붕어빵</div>
        </div>
      </div>
      <section class="packed-bags-panel" aria-label="완성된 붕어빵 봉투가 생기는 곳">
        <div class="bag-panel-head">
          <div class="bag-panel-title">완성된 봉투</div>
          <div id="packedCount" class="packed-count">0/6봉투</div>
        </div>
        <div id="bagItems" class="bag-items"><span class="bag-empty">황금 붕어빵 쪽으로 옮기면<br />봉투가 하나씩 생겨요</span></div>
      </section>
    </footer>
  </main>

  <div id="successModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="successTitle">
    <div class="success-card">
      <h2 id="successTitle">잘했어요!</h2>
      <p>18개의 붕어빵을 한 봉지에 3개씩 묶어<br />붕어빵 3개 봉투 6개를 만들었어요.</p>
      <div class="success-actions">
        <button id="closeSuccessBtn" class="primary-btn" type="button">확인</button>
        <button id="againBtn" class="secondary-btn" type="button">다시 하기</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const TOTAL_ITEMS = 18;
      const GROUP_SIZE = 3;
      const TARGET_GROUPS = TOTAL_ITEMS / GROUP_SIZE;
      const COLORS = ["#12b9c7", "#f06d3a", "#7b55e8", "#24aa68", "#f3b53d", "#e6588d"];

      const ITEM_POSITIONS = [
        { x: 12, y: 18, rot: -10 }, { x: 27, y: 19, rot: 7 }, { x: 42, y: 18, rot: -4 },
        { x: 57, y: 20, rot: 9 }, { x: 72, y: 18, rot: -7 }, { x: 87, y: 20, rot: 6 },
        { x: 17, y: 43, rot: 8 }, { x: 32, y: 42, rot: -8 }, { x: 47, y: 44, rot: 4 },
        { x: 62, y: 43, rot: -5 }, { x: 77, y: 44, rot: 10 }, { x: 92, y: 42, rot: -8 },
        { x: 12, y: 68, rot: 5 }, { x: 27, y: 69, rot: -7 }, { x: 42, y: 68, rot: 8 },
        { x: 57, y: 69, rot: -4 }, { x: 72, y: 68, rot: 7 }, { x: 87, y: 69, rot: -6 }
      ];

      const state = {
        groups: [],
        itemToGroup: Array(TOTAL_ITEMS).fill(null),
        isDrawing: false,
        isPacking: false,
        drawingPoints: [],
        selectedGroup: null,
        completed: false,
        successShown: false
      };

      const activity = document.getElementById("activity");
      const drawingBoard = document.getElementById("drawingBoard");
      const itemsLayer = document.getElementById("itemsLayer");
      const groupsSvg = document.getElementById("groupsSvg");
      const labelsLayer = document.getElementById("labelsLayer");
      const drawCanvas = document.getElementById("drawCanvas");
      const feedback = document.getElementById("feedback");
      const remainPill = document.getElementById("remainPill");
      const bagBadge = document.getElementById("bagBadge");
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      const goldenDrop = document.getElementById("goldenDrop");
      const packingBag = document.getElementById("packingBag");
      const bagItems = document.getElementById("bagItems");
      const packedCount = document.getElementById("packedCount");
      const successModal = document.getElementById("successModal");

      document.addEventListener("DOMContentLoaded", init);

      function init() {
        renderItems();
        resizeCanvas();
        renderAll();
        attachEvents();
      }

      function attachEvents() {
        drawingBoard.addEventListener("pointerdown", startDrawing);
        drawingBoard.addEventListener("pointermove", moveDrawing);
        drawingBoard.addEventListener("pointerup", endDrawing);
        drawingBoard.addEventListener("pointercancel", cancelDrawing);
        drawingBoard.addEventListener("pointerleave", (event) => {
          if (state.isDrawing && event.pointerType === "mouse") endDrawing(event);
        });

        document.getElementById("undoBtn").addEventListener("click", undoLastGroup);
        document.getElementById("resetBtn").addEventListener("click", resetAll);
        document.getElementById("closeSuccessBtn").addEventListener("click", () => closeModal(successModal));
        document.getElementById("againBtn").addEventListener("click", () => {
          closeModal(successModal);
          resetAll();
        });
        fullscreenBtn.addEventListener("click", toggleFullscreen);
        goldenDrop.addEventListener("click", () => {
          if (state.selectedGroup !== null) deliverGroup(state.selectedGroup);
        });

        document.addEventListener("fullscreenchange", updateFullscreenLabel);
        document.addEventListener("webkitfullscreenchange", updateFullscreenLabel);
        window.addEventListener("resize", () => {
          resizeCanvas();
          drawCurrentPath();
        });
      }

      function renderItems() {
        itemsLayer.innerHTML = "";
        ITEM_POSITIONS.forEach((item, index) => {
          const fish = document.createElement("div");
          fish.className = "fish-item";
          fish.dataset.id = String(index);
          fish.style.setProperty("--x", String(item.x));
          fish.style.setProperty("--y", String(item.y));
          fish.style.setProperty("--rot", `${item.rot}deg`);
          fish.innerHTML = fishSvg(index);
          itemsLayer.appendChild(fish);
        });
      }

      function fishSvg(index) {
        const gradId = `fishBreadGrad${index}`;
        return `
          <svg viewBox="0 0 130 94" focusable="false">
            <defs>
              <linearGradient id="${gradId}" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#ffe7a5" />
                <stop offset=".42" stop-color="#e9a756" />
                <stop offset="1" stop-color="#b96b2e" />
              </linearGradient>
            </defs>
            <path class="fish-outline" fill="url(#${gradId})" d="M14 52 C22 21 59 10 91 29 C101 22 116 16 126 19 C119 32 118 44 127 58 C113 62 101 58 90 50 C60 73 25 75 14 52 Z" />
            <path class="fish-highlight" d="M31 39 C43 23 68 22 83 32 C58 27 43 33 31 48 Z" />
            <circle class="fish-eye" cx="34" cy="44" r="4.5" />
            <path class="fish-scale" d="M48 35 C55 39 58 46 57 55" />
            <path class="fish-scale" d="M63 31 C71 38 74 47 71 59" />
            <path class="fish-scale" d="M78 34 C84 41 86 49 83 59" />
            <path class="fish-scale" d="M48 60 C59 65 73 64 84 57" />
            <path class="fish-detail" d="M101 32 C109 37 112 44 109 53 C105 47 100 43 94 40 Z" />
          </svg>`;
      }

      function startDrawing(event) {
        if (state.isPacking) return;
        if (state.completed) {
          setFeedback("이미 붕어빵 3개 봉투를 모두 만들었어요. 다시 하려면 처음으로를 눌러 주세요.", "good", "✅");
          return;
        }
        if (getUngroupedCount() === 0) {
          setFeedback("만들어진 봉지를 아래 왼쪽 황금 붕어빵 쪽으로 옮겨 보세요.", "good", "🛍️");
          highlightPackingTarget(true);
          return;
        }
        state.selectedGroup = null;
        highlightPackingTarget(false);
        event.preventDefault();
        try { drawingBoard.setPointerCapture(event.pointerId); } catch (_) {}
        state.isDrawing = true;
        state.drawingPoints = [eventToPoint(event)];
        drawCurrentPath();
      }

      function moveDrawing(event) {
        if (!state.isDrawing) return;
        event.preventDefault();
        const point = eventToPoint(event);
        const last = state.drawingPoints[state.drawingPoints.length - 1];
        const dist = Math.hypot(point.x - last.x, point.y - last.y);
        if (dist >= 0.006) {
          state.drawingPoints.push(point);
          drawCurrentPath();
        }
      }

      function endDrawing(event) {
        if (!state.isDrawing) return;
        event.preventDefault();
        try { drawingBoard.releasePointerCapture(event.pointerId); } catch (_) {}
        state.isDrawing = false;
        const points = state.drawingPoints.slice();
        state.drawingPoints = [];
        clearCanvas();

        if (points.length < 8 || Math.abs(polygonArea(points)) < 0.003) {
          setFeedback("조금 더 크게 둘러 선을 그어 주세요.", "warn", "✏️");
          return;
        }

        const candidates = ITEM_POSITIONS
          .map((item, id) => ({ id, point: { x: item.x / 100, y: item.y / 100 } }))
          .filter((item) => pointInPolygon(item.point, points));

        const alreadyGrouped = candidates.filter((item) => typeof state.itemToGroup[item.id] === "number");
        const ungrouped = candidates.filter((item) => state.itemToGroup[item.id] === null);

        if (alreadyGrouped.length > 0) {
          setFeedback("이미 만들어진 봉지는 다시 묶지 않아요. 남은 붕어빵만 둘러 주세요.", "warn", "🔎");
          return;
        }

        if (ungrouped.length !== GROUP_SIZE) {
          const countText = ungrouped.length === 0 ? "붕어빵이 들어가지 않았어요" : `붕어빵이 ${ungrouped.length}개 들어갔어요`;
          setFeedback(`${countText}. 한 봉지에는 3개가 들어가야 해요.`, "warn", "💭");
          return;
        }

        createGroup(ungrouped.map((item) => item.id), points);
      }

      function cancelDrawing() {
        state.isDrawing = false;
        state.drawingPoints = [];
        clearCanvas();
      }

      function createGroup(itemIds, points) {
        const groupId = state.groups.length + 1;
        const color = COLORS[(groupId - 1) % COLORS.length];
        const smoothed = simplifyPoints(points, 0.004);
        state.groups.push({ id: groupId, itemIds, points: smoothed, color, packed: false, packedOrder: null });
        itemIds.forEach((id) => { state.itemToGroup[id] = groupId; });
        state.selectedGroup = groupId;
        const remaining = getUngroupedCount();
        const message = remaining === 0
          ? "모든 봉지를 만들었어요. 봉지 라벨을 아래 왼쪽 황금 붕어빵 쪽으로 옮겨 보세요."
          : `${groupId}봉지가 만들어졌어요. 봉지 라벨을 아래 왼쪽으로 옮기거나 남은 붕어빵도 3개씩 묶어 보세요.`;
        setFeedback(message, "good", remaining === 0 ? "🛍️" : "✅");
        highlightPackingTarget(true);
        renderAll();
      }

      function renderAll() {
        renderGroupShapes();
        renderLabels();
        updateItemStates();
        updateBadges();
        updateCompletionState();
      }

      function renderGroupShapes() {
        groupsSvg.innerHTML = state.groups.filter((group) => !group.packed).map((group) => {
          const d = pathData(group.points);
          return `<path class="group-shape" data-group-id="${group.id}" d="${d}" fill="${group.color}" fill-opacity="0.23" stroke="${group.color}" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.88" />`;
        }).join("");
        groupsSvg.querySelectorAll(".group-shape").forEach(attachGroupPointer);
      }

      function renderLabels() {
        labelsLayer.innerHTML = state.groups
          .filter((group) => !group.packed)
          .map((group) => {
            const center = getGroupCenter(group.itemIds);
            const selectedClass = state.selectedGroup === group.id ? " selected" : "";
            return `<button type="button" class="bag-label${selectedClass}" data-group-id="${group.id}" style="--x:${center.x * 100}; --y:${center.y * 100}; --color:${group.color};" aria-label="${group.id}봉지를 황금 붕어빵 쪽으로 옮기기">${group.id}봉지</button>`;
          }).join("");
        labelsLayer.querySelectorAll(".bag-label").forEach(attachGroupPointer);
      }

      function updateItemStates() {
        document.querySelectorAll(".fish-item").forEach((el) => {
          const id = Number(el.dataset.id);
          const marker = state.itemToGroup[id];
          el.classList.toggle("grouped", marker !== null && marker !== "packed");
          el.classList.toggle("packed", marker === "packed");
        });
      }

      function updateBadges() {
        const notPacked = getNotPackedCount();
        const packedGroups = getPackedGroupCount();
        remainPill.textContent = `${notPacked}개 남음`;
        bagBadge.textContent = `${packedGroups}/${TARGET_GROUPS}봉투 완성`;
        packedCount.textContent = `${packedGroups}/${TARGET_GROUPS}봉투`;
        renderBagItems();
      }

      function updateCompletionState() {
        state.completed = getPackedGroupCount() === TARGET_GROUPS;
        drawingBoard.classList.toggle("complete", state.completed);
      }

      function undoLastGroup() {
        closeModal(successModal);
        if (state.isPacking) return;
        if (state.groups.length === 0) {
          setFeedback("아직 취소할 봉지가 없어요.", "warn", "↩️");
          return;
        }
        const group = state.groups[state.groups.length - 1];
        if (group.packed) {
          group.packed = false;
          group.packedOrder = null;
          group.itemIds.forEach((id) => { state.itemToGroup[id] = group.id; });
          state.selectedGroup = group.id;
          state.successShown = false;
          setFeedback(`${group.id}봉지를 봉지에서 다시 꺼냈어요. 필요하면 다시 아래로 옮겨 주세요.`, "warn", "↩️");
          highlightPackingTarget(true);
        } else {
          state.groups.pop();
          group.itemIds.forEach((id) => { state.itemToGroup[id] = null; });
          state.selectedGroup = null;
          state.successShown = false;
          setFeedback(`${group.id}봉지를 취소했어요. 다시 3개씩 둘러 주세요.`, "warn", "↩️");
          highlightPackingTarget(false);
        }
        renderAll();
      }

      function resetAll() {
        state.groups = [];
        state.itemToGroup = Array(TOTAL_ITEMS).fill(null);
        state.drawingPoints = [];
        state.isDrawing = false;
        state.isPacking = false;
        state.selectedGroup = null;
        state.completed = false;
        state.successShown = false;
        clearCanvas();
        closeModal(successModal);
        highlightPackingTarget(false);
        setFeedback("붕어빵 3개를 둘러 선을 그은 뒤, 만들어진 봉지를 아래 왼쪽 황금 붕어빵 쪽으로 옮겨 보세요.", "", "👆");
        renderAll();
      }

      function setFeedback(text, tone = "", icon = "💬") {
        feedback.className = `feedback ${tone}`.trim();
        feedback.innerHTML = `<span aria-hidden="true">${icon}</span><span>${text}</span>`;
      }

      function attachGroupPointer(element) {
        element.addEventListener("pointerdown", (event) => {
          if (state.isPacking) return;
          if (typeof event.button === "number" && event.button !== 0) return;
          event.preventDefault();
          event.stopPropagation();

          const groupId = Number(element.dataset.groupId);
          const group = state.groups.find((item) => item.id === groupId && !item.packed);
          if (!group) return;

          const startX = event.clientX;
          const startY = event.clientY;
          let dragging = false;
          let ghost = null;

          const onMove = (moveEvent) => {
            const distance = Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY);
            if (!dragging && distance > 7) {
              dragging = true;
              ghost = createGroupGhost(group, moveEvent.clientX, moveEvent.clientY);
              getOverlayRoot().appendChild(ghost);
              element.classList.add("is-being-dragged");
              highlightPackingTarget(true);
            }
            if (dragging && ghost) {
              moveEvent.preventDefault();
              ghost.style.left = `${moveEvent.clientX}px`;
              ghost.style.top = `${moveEvent.clientY}px`;
              goldenDrop.classList.toggle("hovering", isOverPackingTarget(moveEvent.clientX, moveEvent.clientY));
            }
          };

          const cleanup = () => {
            if (ghost) ghost.remove();
            element.classList.remove("is-being-dragged");
            goldenDrop.classList.remove("hovering");
          };

          const onUp = (upEvent) => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            window.removeEventListener("pointercancel", onCancel);

            if (dragging) {
              const dropped = isOverPackingTarget(upEvent.clientX, upEvent.clientY);
              cleanup();
              if (dropped) deliverGroup(groupId);
              else {
                highlightPackingTarget(false);
                setFeedback("봉지를 아래 왼쪽 황금 붕어빵 쪽으로 옮겨 놓아 보세요.", "warn", "🛍️");
              }
              return;
            }

            cleanup();
            toggleSelectedGroup(groupId);
          };

          const onCancel = () => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            window.removeEventListener("pointercancel", onCancel);
            cleanup();
            highlightPackingTarget(false);
          };

          window.addEventListener("pointermove", onMove, { passive: false });
          window.addEventListener("pointerup", onUp);
          window.addEventListener("pointercancel", onCancel);
        });
      }

      function toggleSelectedGroup(groupId) {
        const group = state.groups.find((item) => item.id === groupId && !item.packed);
        if (!group) return;
        state.selectedGroup = state.selectedGroup === groupId ? null : groupId;
        highlightPackingTarget(state.selectedGroup !== null);
        renderLabels();
        if (state.selectedGroup !== null) {
          setFeedback(`${groupId}봉지를 골랐어요. 아래 왼쪽 황금 붕어빵 쪽을 누르거나 그쪽으로 끌어 옮겨 보세요.`, "good", "🛍️");
        } else {
          setFeedback("선택을 풀었어요. 다시 봉지를 고르거나 남은 붕어빵을 묶어 보세요.", "", "👆");
        }
      }

      function createGroupGhost(group, x, y) {
        const ghost = document.createElement("div");
        ghost.className = "group-ghost";
        ghost.style.setProperty("--color", group.color);
        ghost.style.left = `${x}px`;
        ghost.style.top = `${y}px`;
        ghost.innerHTML = `<strong>${group.id}봉지</strong><span class="ghost-fish" aria-hidden="true">붕어빵 3개</span>`;
        return ghost;
      }

      function isOverPackingTarget(x, y) {
        const target = document.elementFromPoint(x, y);
        return Boolean(target?.closest?.("#goldenDrop, #packingBag, .golden-target, .shop-sign"));
      }

      function highlightPackingTarget(on) {
        goldenDrop.classList.toggle("drop-ready", Boolean(on));
        packingBag.classList.toggle("drop-ready", Boolean(on));
      }

      async function deliverGroup(groupId) {
        if (state.isPacking) return;
        const group = state.groups.find((item) => item.id === groupId && !item.packed);
        if (!group) return;

        state.isPacking = true;
        state.selectedGroup = null;
        highlightPackingTarget(false);
        goldenDrop.classList.add("receiving");
        packingBag.classList.add("open");
        setFeedback(`${group.id}봉지를 황금 붕어빵 쪽으로 옮겨 새 봉투를 만들고 있어요.`, "good", "🛍️");
        renderLabels();

        try {
          await animateGroupIntoBag(group);
        } finally {
          const nextPackedOrder = getPackedGroupCount() + 1;
          group.packed = true;
          group.packedOrder = nextPackedOrder;
          group.itemIds.forEach((id) => { state.itemToGroup[id] = "packed"; });
          state.isPacking = false;
          goldenDrop.classList.remove("receiving");
          packingBag.classList.remove("open");
          renderAll();
        }

        const packedGroups = getPackedGroupCount();
        if (packedGroups === TARGET_GROUPS && !state.successShown) {
          state.successShown = true;
          setFeedback("붕어빵 3개 봉투 6개가 모두 생겼어요!", "good", "🎉");
          window.setTimeout(() => openModal(successModal), 650);
        } else {
          const ungrouped = getUngroupedCount();
          const nextMessage = ungrouped > 0
            ? `${packedGroups}봉투가 생겼어요. 남은 붕어빵도 3개씩 묶어 주세요.`
            : `${packedGroups}봉투가 생겼어요. 남은 봉지도 아래 왼쪽으로 옮겨 주세요.`;
          setFeedback(nextMessage, "good", "✅");
        }
      }

      async function animateGroupIntoBag(group) {
        const targetRect = packingBag.getBoundingClientRect();
        const animations = group.itemIds.map((id, index) => flyFishToBag(id, targetRect, index, group.itemIds.length));
        await Promise.all(animations);
      }

      async function flyFishToBag(id, targetRect, index, total) {
        const element = document.querySelector(`.fish-item[data-id="${id}"]`);
        if (!element || !targetRect.width || !targetRect.height) return wait(260);

        const from = element.getBoundingClientRect();
        const clone = element.cloneNode(true);
        clone.classList.remove("grouped", "packed");
        clone.classList.add("fly-fish");
        clone.style.left = `${from.left}px`;
        clone.style.top = `${from.top}px`;
        clone.style.width = `${from.width}px`;
        clone.style.height = `${from.height}px`;
        clone.style.transform = "none";
        getOverlayRoot().appendChild(clone);
        element.style.opacity = ".18";

        const spread = total === 1 ? 0 : (index - (total - 1) / 2) * Math.min(34, targetRect.width * .24);
        const targetX = targetRect.left + targetRect.width / 2 - from.left - from.width / 2 + spread;
        const targetY = targetRect.top + targetRect.height * .48 - from.top - from.height / 2 + (index % 2 ? 10 : -8);
        const rotate = index % 2 ? 10 : -10;
        const duration = 520 + index * 90;

        try {
          const animation = clone.animate([
            { transform: "translate(0, 0) scale(1) rotate(0deg)", opacity: 1, offset: 0 },
            { transform: `translate(${targetX * .48}px, ${targetY * .28 - 64}px) scale(1.16) rotate(${rotate}deg)`, opacity: 1, offset: .52 },
            { transform: `translate(${targetX}px, ${targetY}px) scale(.42) rotate(${rotate * -0.45}deg)`, opacity: .20, offset: 1 }
          ], { duration, easing: "cubic-bezier(.18,.72,.2,1)", fill: "forwards" });
          await animation.finished;
        } catch (_) {
          await wait(duration);
        } finally {
          element.style.opacity = "";
          clone.remove();
        }
      }

      function renderBagItems() {
        const packedGroups = state.groups
          .filter((group) => group.packed)
          .sort((a, b) => (a.packedOrder || 0) - (b.packedOrder || 0));
        if (packedGroups.length === 0) {
          bagItems.innerHTML = `<span class="bag-empty">황금 붕어빵 쪽으로 옮기면<br />봉투가 하나씩 생겨요</span>`;
          return;
        }
        bagItems.innerHTML = packedGroups.map((group) => `
          <div class="finished-bag" style="--color:${group.color};" aria-label="${group.packedOrder || group.id}번째 붕어빵 3개 봉투">
            <div class="bag-fish-row" aria-hidden="true">
              <span class="bag-mini-fish" style="--rot:-9deg"></span>
              <span class="bag-mini-fish" style="--rot:4deg"></span>
              <span class="bag-mini-fish" style="--rot:10deg"></span>
            </div>
            <div class="finished-bag-text"><span>붕어빵</span><strong>3개</strong></div>
            <div class="finished-bag-index">${group.packedOrder || group.id}봉투</div>
          </div>
        `).join("");
      }

      function getRemainingCount() {
        return getUngroupedCount();
      }

      function getUngroupedCount() {
        return state.itemToGroup.filter((group) => group === null).length;
      }

      function getPackedItemCount() {
        return state.itemToGroup.filter((group) => group === "packed").length;
      }

      function getNotPackedCount() {
        return TOTAL_ITEMS - getPackedItemCount();
      }

      function getPackedGroupCount() {
        return state.groups.filter((group) => group.packed).length;
      }

      function getOverlayRoot() {
        return document.fullscreenElement || document.webkitFullscreenElement || activity || document.body;
      }

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      function getGroupCenter(itemIds) {
        const total = itemIds.reduce((acc, id) => {
          acc.x += ITEM_POSITIONS[id].x / 100;
          acc.y += ITEM_POSITIONS[id].y / 100;
          return acc;
        }, { x: 0, y: 0 });
        return { x: total.x / itemIds.length, y: total.y / itemIds.length };
      }

      function eventToPoint(event) {
        const rect = drawingBoard.getBoundingClientRect();
        const x = rect.width ? (event.clientX - rect.left) / rect.width : 0;
        const y = rect.height ? (event.clientY - rect.top) / rect.height : 0;
        return { x: clamp(x, 0, 1), y: clamp(y, 0, 1) };
      }

      function drawCurrentPath() {
        resizeCanvas();
        clearCanvas();
        if (!state.drawingPoints.length) return;
        const rect = drawingBoard.getBoundingClientRect();
        const ctx = drawCanvas.getContext("2d");
        ctx.save();
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#09aebf";
        ctx.fillStyle = "rgba(18,185,199,.12)";
        ctx.beginPath();
        state.drawingPoints.forEach((point, index) => {
          const x = point.x * rect.width;
          const y = point.y * rect.height;
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
        if (state.drawingPoints.length > 4) {
          const first = state.drawingPoints[0];
          const last = state.drawingPoints[state.drawingPoints.length - 1];
          ctx.setLineDash([8, 10]);
          ctx.strokeStyle = "rgba(9,174,191,.52)";
          ctx.beginPath();
          ctx.moveTo(last.x * rect.width, last.y * rect.height);
          ctx.lineTo(first.x * rect.width, first.y * rect.height);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.beginPath();
          state.drawingPoints.forEach((point, index) => {
            const x = point.x * rect.width;
            const y = point.y * rect.height;
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function clearCanvas() {
        const ctx = drawCanvas.getContext("2d");
        ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      }

      function resizeCanvas() {
        const rect = drawingBoard.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const dpr = window.devicePixelRatio || 1;
        const width = Math.round(rect.width * dpr);
        const height = Math.round(rect.height * dpr);
        if (drawCanvas.width !== width || drawCanvas.height !== height) {
          drawCanvas.width = width;
          drawCanvas.height = height;
          drawCanvas.style.width = `${rect.width}px`;
          drawCanvas.style.height = `${rect.height}px`;
          const ctx = drawCanvas.getContext("2d");
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      }

      function pathData(points) {
        if (!points.length) return "";
        const commands = points.map((point, index) => {
          const x = Math.round(point.x * 1000);
          const y = Math.round(point.y * 1000);
          return `${index === 0 ? "M" : "L"}${x} ${y}`;
        });
        return `${commands.join(" ")} Z`;
      }

      function simplifyPoints(points, tolerance) {
        if (points.length <= 24) return points;
        const simplified = [points[0]];
        let last = points[0];
        for (let i = 1; i < points.length - 1; i += 1) {
          const point = points[i];
          if (Math.hypot(point.x - last.x, point.y - last.y) >= tolerance) {
            simplified.push(point);
            last = point;
          }
        }
        simplified.push(points[points.length - 1]);
        return simplified;
      }

      function polygonArea(points) {
        let sum = 0;
        for (let i = 0; i < points.length; i += 1) {
          const current = points[i];
          const next = points[(i + 1) % points.length];
          sum += current.x * next.y - next.x * current.y;
        }
        return sum / 2;
      }

      function pointInPolygon(point, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i, i += 1) {
          const xi = polygon[i].x;
          const yi = polygon[i].y;
          const xj = polygon[j].x;
          const yj = polygon[j].y;
          const intersects = ((yi > point.y) !== (yj > point.y)) &&
            (point.x < ((xj - xi) * (point.y - yi)) / ((yj - yi) || 1e-9) + xi);
          if (intersects) inside = !inside;
        }
        return inside;
      }

      async function toggleFullscreen() {
        const doc = document;
        try {
          if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
            if (activity.requestFullscreen) await activity.requestFullscreen();
            else if (activity.webkitRequestFullscreen) activity.webkitRequestFullscreen();
          } else {
            if (doc.exitFullscreen) await doc.exitFullscreen();
            else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
          }
        } catch (_) {
          setFeedback("브라우저에서 전체화면 전환을 막았어요. 주소창 메뉴의 전체화면을 사용해 보세요.", "warn", "🖥️");
        }
        updateFullscreenLabel();
      }

      function updateFullscreenLabel() {
        const full = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        fullscreenBtn.textContent = full ? "화면 복귀" : "전체화면";
      }

      function openModal(modal) { modal.classList.add("open"); }
      function closeModal(modal) { modal.classList.remove("open"); }
      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    })();
  </script>
</body>
</html>
